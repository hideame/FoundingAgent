[pytest]
# テストディレクトリとファイルのパターン
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 出力設定
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# マーカー定義
markers =
    slow: 時間がかかるテストにマーク
    integration: 統合テストにマーク
    unit: 単体テストにマーク

# パス設定
pythonpath = .

# キャッシュディレクトリ
cache_dir = .pytest_cache
