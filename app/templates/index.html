<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founder's Pilot - 起業伴走エージェント</title>
    <!-- htmx -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="container mx-auto p-4 max-w-4xl">
        <header class="mb-8 py-4 border-b border-gray-200">
            <h1 class="text-3xl font-bold text-blue-700">Founder's Pilot</h1>
            <p class="text-gray-600">あなたの起業を成功へ導くAIパートナー</p>
        </header>

        <main id="main-content">
            {% block content %}
            <!-- Flowchart removed and moved to document/loan_flow.md -->

            <!-- Default Content -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">創業計画書作成を始めましょう</h2>
                <p class="mb-6">日本政策金融公庫の融資に必要な情報を、対話形式で整理します。</p>
                <button
                    hx-get="/chat/start"
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                    作成を開始する
                </button>
            </div>
            {% endblock %}
        </main>

        <footer class="mt-12 text-center text-gray-500 text-sm">
            &copy; 2026 Founder's Pilot. Powered by Gemini & Google Cloud.
        </footer>
    </div>
</body>
</html>
