<div class="industry-selector mb-6">

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
        <button hx-post="/chat/select_industry"
                hx-vals='{"industry": "1"}'
                hx-target="#workspace-area"
                hx-swap="innerHTML"
                class="px-4 py-3 bg-white border-2 border-gray-300 text-gray-700 rounded-lg text-sm hover:border-blue-600 hover:bg-blue-50 transition-all text-left">
            <span class="font-bold text-blue-600">1.</span> 飲食店
            <span class="block text-xs text-gray-500 mt-1">カフェ、レストラン、居酒屋等</span>
        </button>
        <button hx-post="/chat/select_industry"
                hx-vals='{"industry": "2"}'

                class="px-4 py-3 bg-white border-2 border-gray-300 text-gray-700 rounded-lg text-sm hover:border-blue-600 hover:bg-blue-50 transition-all text-left">

            <span class="block text-xs text-gray-500 mt-1">美容室、ネイルサロン、エステ等</span>
        </button>
        <button hx-post="/chat/select_industry"
