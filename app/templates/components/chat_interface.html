<div class="flex flex-col h-[600px] border rounded-lg bg-gray-50">
    <!-- Chat History -->
    <div id="chat-history" class="flex-1 overflow-y-auto p-4 space-y-4">
        <!-- Initial Message -->
        {% include "components/message.html" %}
    </div>

    <!-- Input Area -->
    <div class="border-t bg-white p-4 rounded-b-lg">
        <form hx-post="/chat/message"
              hx-target="#chat-history"
              hx-swap="beforeend"
              hx-on::after-request="this.reset()"
              class="flex gap-2">
            <input type="text"
                   name="user_message"
                   class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="メッセージを入力してください..."
                   required
                   autocomplete="off">
            <button type="submit"
                    class="bg-blue-600 text-white rounded-lg px-6 py-2 hover:bg-blue-700 transition-colors font-semibold">
                送信
            </button>
        </form>
        <div class="text-xs text-center text-gray-400 mt-2">
            AIも間違いを犯す可能性があります。重要な情報は必ず確認してください。
        </div>
    </div>
</div>

<!-- Auto-scroll to bottom script -->
<script>
    const chatHistory = document.getElementById('chat-history');
    const observer = new MutationObserver(() => {
        chatHistory.scrollTop = chatHistory.scrollHeight;
    });
    observer.observe(chatHistory, { childList: true });
</script>
