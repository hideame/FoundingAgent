<div class="flex flex-col h-[600px] border rounded-lg bg-gray-50">
  <!-- Chat History -->
  <div id="chat-history" class="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col-reverse">
    <!-- Scroll Anchor (最下部に自動スクロール) -->
    <div id="chat-bottom"></div>

    {% if additional_content %}
    <!-- 追加コンテンツ（業種選択ボタンなど） -->
    {{ additional_content | safe }}
    {% endif %}

    <!-- Initial Message -->
    {% include "components/message.html" %}

    {% if show_industry_selection %}
    <!-- ユーザーの業種選択を表示 -->
    <div class="flex justify-end">
      <div class="bg-blue-600 text-white px-4 py-2 rounded-lg max-w-md text-sm">
        {{ show_industry_selection }}
      </div>
    </div>
    {% endif %}
  </div>

  <!-- Input Area -->
  <div class="border-t bg-white p-4 rounded-b-lg">
    <form hx-post="/chat/message"
          hx-target="#chat-bottom"
          hx-swap="afterbegin"
          hx-on::after-request="this.reset()"
          class="flex gap-2">
      <textarea name="user_message"
                rows="4"
                class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                placeholder="メッセージを入力してください..."
                required></textarea>
      <button type="submit"
              class="bg-blue-600 text-white rounded-lg px-6 py-2 hover:bg-blue-700 transition-colors font-semibold h-fit self-end">
        送信
      </button>
    </form>
    <div class="text-xs text-center text-gray-400 mt-2">
      AIも間違いを犯す可能性があります。重要な情報は必ず確認してください。
    </div>
  </div>
</div>
