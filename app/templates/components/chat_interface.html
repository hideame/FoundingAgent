<div class="flex flex-col h-full m-4 border rounded-lg bg-gray-50 shadow-sm">
  <!-- Chat History -->
  <div id="chat-history" class="flex-1 overflow-y-auto p-4 space-y-4">
    {% if show_industry_selection %}
    <!-- ユーザーの業種選択を表示 -->
    <div class="flex justify-end">
      <div class="bg-blue-600 text-white px-4 py-2 rounded-lg max-w-md text-sm">
        {{ show_industry_selection }}
      </div>
    </div>
    {% endif %}

    <!-- Initial Message -->
    {% include "components/message.html" %}

    {% if example_text %}
    <!-- 記入例カード -->
    <div class="flex justify-start">
      <div class="bg-amber-50 border border-amber-200 px-4 py-3 rounded-lg max-w-2xl text-sm ml-12">
        <div class="font-semibold text-amber-800 mb-2">📋 {{ example_label }}</div>
        <div class="text-gray-700 whitespace-pre-wrap text-xs leading-relaxed">{{ example_text }}</div>
      </div>
    </div>
    {% endif %}

    {% if additional_content %}
    <!-- 追加コンテンツ（業種選択ボタンなど） -->
    {{ additional_content | safe }}
    {% endif %}
  </div>

  <!-- Input Area -->
  <div class="border-t bg-white p-4 rounded-b-lg">
    <form hx-post="/chat/message"
          hx-target="#chat-history"
          hx-swap="beforeend"
          hx-on::after-request="this.reset()"
          class="flex gap-2">
      <textarea name="user_message"
                rows="6"
                class="flex-1 border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                placeholder="メッセージを入力してください..."
                required></textarea>
      <button type="submit"
              class="bg-blue-600 text-white rounded-lg px-6 py-2 hover:bg-blue-700 transition-colors font-semibold h-fit self-end">
        送信
      </button>
    </form>
    <div class="text-xs text-center text-gray-400 mt-2">
      AIも間違いを犯す可能性があります。重要な情報は必ず確認してください。
    </div>
  </div>
</div>

<!-- Auto-scroll to bottom script -->
<script>
  (function() {
    const chatHistory = document.getElementById('chat-history');
    if (chatHistory && !chatHistory.dataset.observerInitialized) {
      const observer = new MutationObserver(() => {
        chatHistory.scrollTop = chatHistory.scrollHeight;
      });
      observer.observe(chatHistory, { childList: true });
      chatHistory.dataset.observerInitialized = 'true';
    }
  })();
</script>
