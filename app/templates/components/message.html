<div class="flex {{ 'justify-end' if is_user else 'justify-start' }}">
    <div class="max-w-[80%] rounded-lg p-3 {{ 'bg-blue-600 text-white' if is_user else 'bg-white text-gray-800 shadow-sm border border-gray-200' }}">
        {% if not is_user %}
        <div class="flex items-center gap-2 mb-1">
            <div class="w-6 h-6 rounded-full bg-blue-100 flex items-center justify-center text-xs">🤖</div>
            <span class="text-xs font-bold text-gray-500">Founder's Pilot</span>
        </div>
        {% endif %}
        <div class="prose text-sm {{ 'text-white' if is_user else 'text-gray-800' }}">
            {{ message | safe }}
        </div>
    </div>
</div>
